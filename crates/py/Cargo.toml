[package]
name = "cereyan-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# criterion owns the bench flags; the auto libtest harness rejects them
bench = false
name = "_core"
crate-type = ["cdylib"]

[dependencies]
cereyan-core = { path = "../core" }
cereyan-store = { path = "../store" }
cereyan-server = { path = "../server" }
cereyan-rules = { path = "../rules" }
ureq = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py311"] }
serde = { workspace = true }
serde_json = { workspace = true }
