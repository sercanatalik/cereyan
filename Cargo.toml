[workspace]
resolver = "2"
members = ["crates/core", "crates/store", "crates/rules", "crates/server", "crates/py"]

[workspace.package]
version = "1.6.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.26", features = ["v7", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
crossbeam-channel = "0.5"
dirs = "7.0"
tempfile = "3.27"
pyo3 = "0.29"
utoipa = { version = "5.5", features = ["axum_extras"] }
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
rust-embed = { version = "8.12", features = ["interpolate-folder-path"] }
mime_guess = "2.0"
ureq = { version = "3.4", features = ["json"] }
libc = "0.2"
croner = "4.0"
rrule = "0.14"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.11"
minijinja = { version = "2", features = ["json", "loader"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname", "pool"] }
chacha20poly1305 = "0.10"
base64 = "0.22"
toml = "0.9"
rand = "0.9"
criterion = { version = "0.8", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
